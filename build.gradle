plugins {
    id 'net.neoforged.moddev' version '2.0.74'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge version for Minecraft 1.26.1
    version = neo_version

    // Parchment mappings
    parchment {
        mappingsVersion = parchment_mappings
        minecraftVersion = parchment_mc
    }

    runs {
        client {
            gameDirectory = file('run')
        }
        server {
            gameDirectory = file('run')
        }
    }

    mods {
        superesrmod {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Sodium / Iris are soft dependencies — compileOnly, not required at runtime
    // Uncomment if you want to compile against them:
    // compileOnly("net.caffeinemc:embeddium:0.3.31+mc1.26.1")
    // compileOnly("net.iris:iris:1.8.1+1.26.1")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
